[project]
name = "lol-vision"
version = "0.1.0"
description = "Service vision (lecture seule) pour l'assistant League of Legends : capture, calibration minimap, détection des champions, enregistrement, WebSocket local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "mss>=9.0",
    "requests>=2.32",
    "websockets>=13.0",
    "pillow>=10.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Sur macOS : permet de retrouver la fenêtre du jeu (position, taille) via Quartz.
macos = ["pyobjc-framework-Quartz>=10.0"]

[project.scripts]
vision = "vision.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
